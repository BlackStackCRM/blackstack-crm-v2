<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Sign in - BlackStack CRM</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com">
  </script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'primary': '#000000',
            'on-primary': '#ffffff',
            'primary-container': '#1c1b1b',
            'on-primary-container': '#858383',
            'primary-fixed': '#e5e2e1',
            'primary-fixed-dim': '#c8c6c5',
            'on-primary-fixed': '#1c1b1b',
            'on-primary-fixed-variant': '#474746',
            'inverse-primary': '#c8c6c5',
            'secondary': '#0058be',
            'on-secondary': '#ffffff',
            'secondary-container': '#2170e4',
            'on-secondary-container': '#fefcff',
            'secondary-fixed': '#d8e2ff',
            'secondary-fixed-dim': '#adc6ff',
            'on-secondary-fixed': '#001a42',
            'on-secondary-fixed-variant': '#004395',
            'tertiary': '#000000',
            'on-tertiary': '#ffffff',
            'tertiary-container': '#1c1b1a',
            'on-tertiary-container': '#868382',
            'tertiary-fixed': '#e6e2df',
            'tertiary-fixed-dim': '#cac6c4',
            'on-tertiary-fixed': '#1c1b1a',
            'on-tertiary-fixed-variant': '#484645',
            'error': '#ba1a1a',
            'on-error': '#ffffff',
            'error-container': '#ffdad6',
            'on-error-container': '#93000a',
            'background': '#fdf8f8',
            'on-background': '#1c1b1b',
            'surface': '#fdf8f8',
            'on-surface': '#1c1b1b',
            'surface-variant': '#e5e2e1',
            'on-surface-variant': '#444748',
            'surface-container': '#f1edec',
            'surface-container-low': '#f7f3f2',
            'surface-container-high': '#ebe7e6',
            'surface-container-highest': '#e5e2e1',
            'surface-container-lowest': '#ffffff',
            'surface-bright': '#fdf8f8',
            'surface-dim': '#ddd9d8',
            'surface-tint': '#5f5e5e',
            'inverse-surface': '#313030',
            'inverse-on-surface': '#f4f0ef',
            'outline': '#747878',
            'outline-variant': '#c4c7c7',
          },
          borderRadius: {
            'DEFAULT': '0.125rem',
            'lg': '0.25rem',
            'xl': '0.5rem',
            'full': '0.75rem',
          },
          spacing: {
            'stack-sm': '8px',
            'stack-md': '16px',
            'stack-lg': '32px',
            'container-padding': '24px',
            'gutter': '16px',
            'unit': '4px',
          },
          fontFamily: {
            'body': ['Inter', 'sans-serif'],
            'display': ['Inter', 'sans-serif'],
          },
          fontSize: {
            'body-sm': ['12px', { lineHeight: '16px' }],
            'body-md': ['14px', { lineHeight: '20px' }],
            'label-md': ['12px', { lineHeight: '16px', letterSpacing: '0.5px' }],
            'h3': ['18px', { lineHeight: '24px', letterSpacing: '-0.3px' }],
            'h1': ['28px', { lineHeight: '36px', letterSpacing: '-0.6px' }],
            'display': ['32px', { lineHeight: '40px', letterSpacing: '-0.8px' }],
          },
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/css/app.css"/>
</head>
<body class="bg-background font-body-md text-on-background antialiased">
  <div class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    <div class="absolute -top-[20%] -right-[10%] w-[60%] h-[80%] rounded-full bg-secondary opacity-5 blur-3xl pointer-events-none"></div>
    <div class="absolute top-[40%] -left-[20%] w-[40%] h-[60%] rounded-full bg-primary opacity-5 blur-3xl pointer-events-none"></div>
    <div class="w-full max-w-sm relative z-10">
      <div class="bg-surface-container-lowest rounded-xl shadow-sm p-container-padding border border-outline-variant/30">
        <div class="flex flex-col items-center mb-stack-lg">
          <div class="w-10 h-10 bg-primary flex items-center justify-center rounded-lg mb-stack-md">
            <span class="material-symbols-outlined text-on-primary text-[24px]">token</span>
          </div>
          <h1 class="font-display text-display text-on-surface text-center">Welcome back</h1>
          <p class="font-body-sm text-body-sm text-on-surface-variant text-center mt-1">Sign in to BlackStack CRM</p>
        </div>
        <form id="login-form" novalidate class="space-y-4">
          <div>
            <label for="login-email" class="block font-label-md text-label-md text-on-surface mb-1">Email</label>
            <input type="email" id="login-email" name="email" required autocomplete="email" class="w-full bg-surface-container-low py-2.5 px-3 rounded-lg font-body-sm text-body-sm text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary/40 placeholder:text-on-surface-variant/70 transition-shadow" placeholder="you@company.com"/>
            <p id="login-email-notice" class="hidden mt-1 font-body-sm text-body-sm text-on-surface-variant"></p>
          </div>
          <div>
            <label for="login-password" class="block font-label-md text-label-md text-on-surface mb-1">Password</label>
            <div class="relative">
              <input type="password" id="login-password" name="password" required autocomplete="current-password" class="w-full bg-surface-container-low py-2.5 px-3 pr-10 rounded-lg font-body-sm text-body-sm text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary/40 placeholder:text-on-surface-variant/70 transition-shadow" placeholder="Enter your password"/>
              <button type="button" id="toggle-password" class="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center rounded hover:bg-surface-container transition-colors" aria-label="Toggle password visibility">
                <span class="material-symbols-outlined text-[18px] text-on-surface-variant">visibility_off</span>
              </button>
            </div>
          </div>
          <div id="login-error" class="hidden"></div>
          <button type="submit" id="login-submit" class="w-full flex items-center justify-center gap-2 py-2.5 rounded-lg bg-primary text-on-primary font-label-md text-label-md uppercase tracking-wider hover:bg-primary/90 transition-colors shadow-sm">
            <span class="material-symbols-outlined text-[18px]">login</span>
            Sign in
          </button>
        </form>
        <p class="text-center font-body-sm text-body-sm text-on-surface-variant mt-4">
          Don't have an account? <a href="#" class="text-secondary hover:underline">Contact admin</a>
        </p>
      </div>
      <p class="text-center font-body-sm text-body-sm text-on-surface-variant/60 mt-4">BlackStack CRM V2</p>
    </div>
  </div>
  <script src="/js/utils/email-sanitizer.js">
  </script>
  <script src="/js/api/client.js">
  </script>
  <script src="/js/api/auth.js">
  </script>
  <script src="/js/auth/auth-guard.js">
  </script>
  <script src="/js/pages/login.js">
  </script>
</body>
</html>
